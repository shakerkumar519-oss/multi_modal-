services:
  - type: web
    name: multimodal-ai-backend
    env: python
    buildCommand: pip install -r requirement.txt
    startCommand: python -m uvicorn backend.rag.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_SQLITE_FALLBACK
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
